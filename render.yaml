services:
  - type: web
    name: business-manager
    runtime: node
    region: oregon
    # Always-on paid plan: no idle spin-down, so no keep-alive cron. Keep numInstances at 1:
    # background jobs are lock-guarded, but WebSocket fan-out is per instance.
    plan: starter
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Per-instance pool; keep (instances x this) under the database's connection limit.
      - key: DB_POOL_MAX
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: business-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: PLATFORM_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: SUPPORT_INBOX_EMAIL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Baked into the client bundle at build time, so it must be set here before
      # the build runs. Optional: without it the branch geofence picker uses OpenStreetMap
      # (Leaflet) with server-proxied address search.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false

databases:
  - name: business-manager-db
    # Free Render databases expire; a paid plan includes backups.
    plan: basic-256mb
    region: oregon
