services:
  - type: web
    name: business-manager
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: business-manager-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: NODEMAILER_AUTH_USER
        sync: false
      - key: NODEMAILER_AUTH_PASS
        sync: false

  # Pings the app every 14 minutes to prevent Render free-tier spin-down
  - type: cron
    name: keep-alive
    runtime: node
    region: oregon
    plan: free
    schedule: "*/14 * * * *"
    buildCommand: "true"
    startCommand: node -e "fetch(process.env.APP_URL + '/api/health').then(r => console.log('ping', r.status)).catch(e => console.error('ping failed', e.message))"
    envVars:
      - key: APP_URL
        sync: false

databases:
  - name: business-manager-db
    plan: free
    region: oregon
