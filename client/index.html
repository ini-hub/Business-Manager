<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Per-route title, description, canonical, robots, Open Graph, X and JSON-LD.
         Injected into the HTML the server returns (server/seo.ts) from shared/seo/pages.ts, and kept
         in step during in-app navigation by client/src/components/seo-sync.tsx. -->
    <!--seo-head-->

    <meta name="theme-color" content="#216AC7" />
    <meta name="application-name" content="Kowope" />
    <meta name="apple-mobile-web-app-title" content="Kowope" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 64x64" />
    <link rel="icon" href="/brand/app-icon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/brand/app-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Boot loader: shown until React mounts and replaces #root. Same motion as components/ui/loader.tsx. */
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#216AC7}
      #boot svg{width:80px;height:80px;overflow:visible}
      #boot .a,#boot .bd,#boot .b1,#boot .b2,#boot .b3{transform-box:fill-box}
      #boot .a{transform-origin:50% 0;animation:bA 1.8s cubic-bezier(.2,.7,.2,1) infinite}
      #boot .bd{transform-origin:50% 100%;animation:bBD 1.8s cubic-bezier(.2,.7,.2,1) infinite}
      #boot .b1,#boot .b2,#boot .b3{transform-origin:50% 100%}
      #boot .b1{animation:bB1 1.8s cubic-bezier(.2,.7,.2,1) infinite}
      #boot .b2{animation:bB2 1.8s cubic-bezier(.2,.7,.2,1) infinite}
      #boot .b3{animation:bB3 1.8s cubic-bezier(.2,.7,.2,1) infinite}
      @keyframes bA{0%{transform:translateY(-30%);opacity:0}15%,85%{transform:none;opacity:1}100%{opacity:0}}
      @keyframes bBD{0%,8%{transform:scaleY(.2);opacity:0}25%,85%{transform:none;opacity:1}100%{opacity:0}}
      @keyframes bB1{0%,25%{transform:scaleY(0)}40%,85%{transform:none}100%{transform:scaleY(0)}}
      @keyframes bB2{0%,33%{transform:scaleY(0)}48%,85%{transform:none}100%{transform:scaleY(0)}}
      @keyframes bB3{0%,41%{transform:scaleY(0)}56%,85%{transform:none}100%{transform:scaleY(0)}}
      @media (prefers-reduced-motion:reduce){#boot .a,#boot .bd,#boot .b1,#boot .b2,#boot .b3{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="Loading"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="a"><path d="M3 4.6Q3 3 4.6 3H19.4Q21 3 21 4.6V8A3 3 0 0 1 15 8A3 3 0 0 1 9 8A3 3 0 0 1 3 8Z" fill="#fff"/></g><rect class="bd" x="4" y="12" width="16" height="9" rx="1.6" fill="#fff"/><rect class="b1" x="6.6" y="16.6" width="2.6" height="2.9" rx=".5" fill="#216AC7"/><rect class="b2" x="10.7" y="15" width="2.6" height="4.5" rx=".5" fill="#216AC7"/><rect class="b3" x="14.8" y="13.2" width="2.6" height="6.3" rx=".5" fill="#216AC7"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
