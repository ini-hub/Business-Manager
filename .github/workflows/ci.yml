name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (includes noUnusedLocals)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Dead code (unused files and dependencies)
        run: npm run deadcode
